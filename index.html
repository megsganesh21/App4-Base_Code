<script>

// These variables store the answers
var dehydration_count = 0;
var fatigue_count = 0;

// Adds a point toward dehydration
function dehydrationAdd(){
    dehydration_count = dehydration_count + 1;
}

// Adds a point toward fatigue
function fatigueAdd(){
    fatigue_count = fatigue_count + 1;
}

// Calculates final results
function showResults(){

var total = dehydration_count + fatigue_count;

var dehydrationPercent = Math.round((dehydration_count/total)*100);
var fatiguePercent = Math.round((fatigue_count/total)*100);

var resultText = document.getElementById("results");

resultText.innerHTML =
"Dehydration likelihood: " + dehydrationPercent + "%<br>" +
"Fatigue likelihood: " + fatiguePercent + "%";
}

</script>
